name: CI

# Windows is the reference runtime and macOS is now supported, so both are
# tested on every change. Nothing here needs a browser, a network, or a real
# OpenAI key: the suite mocks every external edge.
on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every cell. A macOS-only or Windows-only failure is exactly the
      # kind of thing this matrix exists to surface, so one red cell must not
      # cancel the others.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create the project environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install -r requirements.txt -r requirements-dev.txt

      # No OPENAI_API_KEY here, deliberately. It used to be set because 26
      # tests failed without it, which meant the suite's result depended on
      # ambient environment and could not be reproduced on a clean machine.
      # Phase 12 moved that into the autouse `provider_keys` fixture, so the
      # suite now supplies its own fake keys and this step proves it: if the
      # dependency ever comes back, CI goes red rather than passing quietly.
      # `-p no:randomly` so the baseline cell is one fixed, reproducible order.
      # The shuffled runs are the next step.
      - name: Run tests
        run: uv run pytest tests/ -q -p no:randomly

      # ROADMAP Phase 12: the suite must be green under a shuffled order, not
      # just the one order pytest happens to collect. Three fixed seeds rather
      # than a random one, so a red cell is reproducible from the log.
      - name: Run tests under shuffled order
        run: |
          uv run pytest tests/ -q --randomly-seed=1
          uv run pytest tests/ -q --randomly-seed=2
          uv run pytest tests/ -q --randomly-seed=3

      - name: Lint
        run: uv run ruff check .
